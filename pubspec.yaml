name: ai_tutor
description: "Scholor AI - Offline personalized AI learning tutor and textbook reader powered by on-device quantized models."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  provider: ^6.1.5+1
  video_player: ^2.11.1
  dio: ^5.9.2
  path_provider: ^2.1.5
  flutter_markdown: ^0.7.7+1
  audioplayers: ^6.1.1
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.2
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.4
  flutter_tts: any
  cached_network_image: any
  intl: ^0.19.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  onnxruntime: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
    - assets/books.db
    - assets/scholor_knowledge.db

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21
